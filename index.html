<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
	</head>
	<body>
            <h1>TEST CHATBOT</h1>

	    <label for="recordTypeId">Record Type Id:</label><br>
            <input type="text" id="recordTypeId" name="Record Type Id" value="012Tj000002pO8nIAE">
	    <br><br>

            <label for="espositoreId">Codice SIA Espositore:</label><br>
            <input type="text" id="espositoreId" name="Espositore Id" value="0098909">
            <br><br>

            <label for="edizione">Codice Edizione:</label><br>
            <input type="text" id="edizione" name="Codice Edizione" value="RIC23">
	    <br><br>

	    <label for="nome">Nome</label><br>
            <input type="text" id="nome" name="Nome" value="Test">
	    <br><br>

	    <label for="cognome">Cognome</label><br>
            <input type="text" id="cognome" name="Cognome" value="Example">
	    <br><br>

	    <label for="profilo">Profilo:</label><br>
            <input type="text" id="profilo" name="Profilo" value="Master">
	    <br><br>

	    <label for="lingua">Lingua:</label><br>
            <input type="text" id="lingua" name="Lingua Area Riservata" value="it">
	    <br><br>

	    <label for="email">Email:</label><br>
            <input type="text" id="email" name="Email" value="test@example.com">
	    <br><br>

	    <label for="numeroPratica">Numero Pratica:</label><br>
            <input type="text" id="numeroPratica" name="Numero Pratica" value="6023">
	    <br><br>

	    <label for="posizioneStand">Posizione & Stand:</label><br>
            <input type="text" id="posizioneStand" name="Posizione e Stand" value="C7 | 312-314">

	    <br><br>

	    <label for="abilitaLiveChat">Abilita Live Chat:</label><br>
            <input type="text" id="abilitaLiveChat" name="Abilita Live Chat" value="true">

	    <br><br>

	    <div>
	        <label for="linguaChatbot">Lingua Chatbot:</label>
	        <select name="Lingua Chatbot" id="linguaChatbot">
	    	    <option value="it">Italiano</option>
	            <option value="en_US">Inglese</option>
	        </select>
	    </div>

            <br><br><br>
            <button onclick="buttonClick()" id="button">Inizializza Chat</button>

            <script type='text/javascript'>
                function buttonClick() {
                    const recordTypeId = document.getElementById("recordTypeId").value;
                    const espositoreId = document.getElementById("espositoreId").value;
                    const edizione = document.getElementById("edizione").value;
                    const nome = document.getElementById("nome").value;
		    const cognome = document.getElementById("cognome").value;
                    const profilo = document.getElementById("profilo").value;
                    const lingua = document.getElementById("lingua").value;
                    const email = document.getElementById("email").value;
                    const numeroPratica = document.getElementById("numeroPratica").value;
                    const posizioneStand = document.getElementById("posizioneStand").value;
                    const abilitaLiveChat = document.getElementById("abilitaLiveChat").value;
		    const linguaChatbot = document.getElementById("linguaChatbot").value;

		    console.log('Record Type Id:', recordTypeId)
                    console.log('Espositore Id:', espositoreId)
                    console.log('Codice Edizione:', edizione)
		    console.log('Nome:', nome)
		    console.log('Cognome:', cognome)
                    console.log('Profilo:', profilo)
                    console.log('Lingua:', lingua)
		    console.log('Email:', email)
                    console.log('Numero Pratica:', numeroPratica)
                    console.log('Posizione e Stand:', posizioneStand)
                    console.log('Abilita Live Chat:', abilitaLiveChat)
		    console.log('Lingua Chatbot:', linguaChatbot)

                    initEmbeddedMessaging(recordTypeId, espositoreId, edizione, nome, cognome, profilo, lingua, email, numeroPratica, posizioneStand, abilitaLiveChat, linguaChatbot)
                }
            </script>

			<script type='text/javascript'>
				function initEmbeddedMessaging(recordTypeId, espositoreId, edizione, nome, cognome, profilo, lingua, email, numeroPratica, posizioneStand, abilitaLiveChat, linguaChatbot) {
					try {
						embeddedservice_bootstrap.settings.language = linguaChatbot; // For example, enter 'en' or 'en-US'

                        window.addEventListener("onEmbeddedMessagingReady", () => {            
                            console.log( "Inside Prechat API!!" );
                            embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields( { 
				    "CaseRecordTypeId" : recordTypeId, 
				    "CodiceEdizione": edizione,
				    "CodiceEspositore" : espositoreId, 
				    "Nome": nome,
				    "Cognome": cognome,
				    "Profilo" : profilo, 
				    "LinguaAreaRiservata": lingua,
				    "Email" : email, 
				    "NumeroPratica": numeroPratica,
				    "PosizioneStand": posizioneStand,
				    "AbilitaLiveChat": abilitaLiveChat,
				    "LinguaChatbot": linguaChatbot
			    } );
                        });
			
						embeddedservice_bootstrap.init(
							'00D1t000000FpSu',
							'IEG_Chat',
							'https://iegexpo.my.site.com/ESWIEGChat1728494794826',
							{
								scrt2URL: 'https://iegexpo.my.salesforce-scrt.com'
							}
						);
                        document.getElementById("button").style = 'display: none';
					} catch (err) {
						console.error('Error loading Embedded Messaging: ', err);
					}
				};
			</script>
			<script type='text/javascript' src='https://iegexpo.my.site.com/ESWIEGChat1728494794826/assets/js/bootstrap.min.js'></script>
	</body>
</html>
